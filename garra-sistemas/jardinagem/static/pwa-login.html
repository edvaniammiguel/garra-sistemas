<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" type="image/png" sizes=a"32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1A2A5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garra Jardinagem">
<title>Garra Jardinagem</title>
<script>
// Limpar TODOS os SW e caches antigos
if(typeof navigator!=="undefined"&&"serviceWorker"in navigator){
  try{
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
    });
    caches.keys().then(function(keys){
      keys.forEach(function(k){ caches.delete(k); });
    });
  }catch(e){}
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#F0F4FF;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:360px;
  box-shadow:0 4px 24px rgba(26,42,94,.12);border:1.5px solid #CBD5E1}
img{display:block;margin:0 auto 1rem;height:56px;object-fit:contain}
h1{font-size:15px;font-weight:800;color:#1A2A5E;text-align:center;margin-bottom:3px}
.sub{font-size:11px;color:#64748B;text-align:center;margin-bottom:.5rem}
.ver{font-size:9px;color:#94A3B8;text-align:center;margin-bottom:1.25rem}
.lbl{display:block;font-size:10px;font-weight:700;color:#64748B;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.inp{width:100%;padding:11px 14px;border:1.5px solid #CBD5E1;border-radius:8px;
  font-size:14px;background:#F8FAFC;margin-bottom:.75rem;outline:none}
.inp:focus{border-color:#1A2A5E}
.pw-wrap{position:relative;margin-bottom:.75rem}
.pw-wrap .inp{margin-bottom:0;padding-right:44px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:18px;color:#64748B;padding:4px}
.btn{width:100%;padding:13px;background:#1A2A5E;color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;margin-top:.25rem}
.btn:disabled{opacity:.6}
.msg{font-size:12px;text-align:center;margin-top:.75rem;min-height:18px;
  color:#64748B;word-break:break-all;line-height:1.4}
</style>
</head>
<body>
<div class="card">
  <img src="./icons/logo-Garra-e-ca%C3%A7ambas.png"
       onerror="this.style.display='none'">
  <h1>Jardinagem</h1>
  <p class="sub">Águas de Pará de Minas</p>
  <p class="ver">v26.05.26h</p>

  <label class="lbl" for="em">Email</label>
  <input class="inp" type="email" id="em" placeholder="seu@email.com" autocomplete="email">

  <label class="lbl" for="pw">Senha</label>
  <div class="pw-wrap">
    <input class="inp" type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
    <button class="eye" type="button" id="eye" onclick="togglePw()">👁</button>
  </div>

  <div class="msg" id="msg"></div>
  <button class="btn" type="button" id="btn" onclick="entrar()">Entrar</button>
</div>

<script>
function $(id){return document.getElementById(id);}
function msg(t,c){$("msg").textContent=t;$("msg").style.color=c||"#64748B";}

function togglePw(){
  var i=$("pw"),e=$("eye");
  i.type=i.type==="password"?"text":"password";
  e.textContent=i.type==="password"?"👁":"🙈";
}

// Detecta ambiente: localhost → DEV (backend local), senão → PRODUÇÃO
var BASE_API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? "http://localhost:8000"
  : "https://garra-sistemas.onrender.com";

function entrar(){
  var em=($("em").value||"").trim();
  var pw=$("pw").value||"";
  if(!em||!pw){msg("Preencha email e senha.","#DC2626");return;}
  $("btn").disabled=true;
  $("btn").textContent="Aguarde...";
  msg("Conectando...","#64748B");
  fetch(BASE_API+"/jardinagem/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:em,senha:pw})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(!d.token){
      msg(d.erro||d.detail||"Login inválido","#DC2626");
      $("btn").disabled=false;
      $("btn").textContent="Entrar";
      return;
    }
    localStorage.setItem("garra_token",d.token);
    localStorage.setItem("garra_usuario",JSON.stringify({nome:d.nome,perfil:d.perfil}));
    msg("Bem-vindo(a), "+d.nome+"! Entrando...","#16A34A");
    // ← pwa-app.html (não mobile-app.html)
    setTimeout(function(){ window.location.href="./pwa-app.html"; }, 800);
  }).catch(function(e){
    msg("Erro de conexão: "+e.message,"#DC2626");
    $("btn").disabled=false;
    $("btn").textContent="Entrar";
  });
}

document.getElementById("pw").addEventListener("keydown",function(e){
  if(e.key==="Enter")entrar();
});
document.getElementById("em").addEventListener("keydown",function(e){
  if(e.key==="Enter")document.getElementById("pw").focus();
});
</script>
</body>
</html>

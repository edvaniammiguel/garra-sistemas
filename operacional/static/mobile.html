<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1A2A5E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Garra — Mobile</title>
<link rel="manifest" href="/mobile/manifest.json"/>
<link rel="icon" href="/static/icons/favicon.ico"/>
<script src="/static/idb.js"></script>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0F4FF;color:#1E293B;
     min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none;border:none}

/* ── CSS VARS ── */
:root{
  --blue:    #1A2A5E;
  --blue2:   #1E3A8A;
  --orange:  #E8820C;
  --bg:      #F0F4FF;
  --card:    #FFFFFF;
  --border:  #CBD5E1;
  --text:    #1E293B;
  --muted:   #64748B;
  --green:   #16A34A;
  --red:     #DC2626;
  --radius:  12px;
  --shadow:  0 2px 12px rgba(26,42,94,.08);
  --nav-h:   64px;
}

/* ── TELA LOGIN ── */
#screen-login{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;background:#F0F4FF;
}
.login-card{
  background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;
  box-shadow:0 4px 24px rgba(26,42,94,.10);border:1.5px solid var(--border);
}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:56px;object-fit:contain}
.login-logo-fallback{
  width:56px;height:56px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--orange);margin:0 auto 8px;
}
.login-title{font-size:20px;font-weight:800;color:var(--blue);text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;
             letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:block}
.field-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-size:15px;color:var(--text);background:#fff;
  transition:.15s;margin-bottom:14px;
}
.field-input:focus{border-color:var(--blue)}
.field-pass-wrap{position:relative;margin-bottom:20px}
.field-pass-wrap .field-input{margin-bottom:0;padding-right:44px}
.btn-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;font-size:18px;color:var(--muted);padding:4px;
}
.btn-login{
  width:100%;padding:14px;background:var(--blue);color:#fff;
  border-radius:8px;font-size:15px;font-weight:700;letter-spacing:.02em;
}
.btn-login:active{opacity:.85}
.login-err{
  background:#FEE2E2;color:var(--red);border-radius:8px;
  padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
  display:none;
}

/* ── APP SHELL ── */
#screen-app{display:none;flex-direction:column;min-height:100dvh}

/* Header */
.app-header{
  background:var(--blue);border-bottom:3px solid var(--orange);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.app-header-left{display:flex;align-items:center;gap:10px}
.app-logo-g{
  width:32px;height:32px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;
}
.app-title{font-size:15px;font-weight:800;color:#fff}
.app-modulo{font-size:11px;color:#93C5FD;font-weight:500}
.app-header-right{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:30px;height:30px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
}
.btn-sair{
  background:rgba(255,255,255,.15);color:#fff;border-radius:6px;
  padding:5px 10px;font-size:12px;font-weight:600;
}

/* Conteúdo principal */
.app-content{
  flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 8px);
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:#fff;border-top:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  z-index:100;box-shadow:0 -2px 12px rgba(26,42,94,.06);
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 16px;background:none;color:var(--muted);
  font-size:10px;font-weight:600;border-radius:8px;transition:.15s;flex:1;
}
.nav-btn.active{color:var(--orange)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:22px;line-height:1;transition:.15s}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.02em}

/* Seções */
.mod-section{display:none;min-height:calc(100dvh - 120px)}
.mod-section.active{display:block}

/* ── COMPONENTES COMUNS ── */
.card{
  background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin:12px 12px 0;
}
.page-title{
  font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);padding:16px 16px 8px;
}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;
         flex-direction:column;gap:10px;color:var(--muted);font-size:13px}
.spin{width:24px;height:24px;border:3px solid var(--border);
      border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px;font-weight:600}
.empty-sub{font-size:12px;margin-top:4px}

/* Checklist iframe */
#sec-check iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  border-radius: 0;
}

/* Toast */
.toast-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
            z-index:9999;pointer-events:none;width:90%;max-width:320px;text-align:center}
.toast{
  display:inline-block;padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:700;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .2s ease;
  margin-bottom:8px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--blue)}

/* Botões */
.btn-primary{
  background:var(--orange);color:#fff;border-radius:8px;
  padding:12px 20px;font-size:14px;font-weight:700;width:100%;
  box-shadow:0 4px 12px rgba(232,130,12,.3);
}
.btn-primary:active{opacity:.85}
.btn-secondary{
  background:#F0F4FF;color:var(--blue);border-radius:8px;
  padding:12px 20px;font-size:14px;font-weight:700;border:1.5px solid var(--border);
}

/* ── SEÇÃO: JARDINAGEM ── */
#sec-jard .jard-tabs{
  display:flex;border-bottom:2px solid var(--border);
  background:#fff;position:sticky;top:63px;z-index:10;
}
#sec-jard .tab{
  flex:1;padding:12px;font-size:12px;font-weight:700;
  color:var(--muted);background:none;border-bottom:3px solid transparent;
  margin-bottom:-2px;text-align:center;
}
#sec-jard .tab.active{color:var(--orange);border-bottom-color:var(--orange)}

/* ── SEÇÃO: OPERACIONAL ── */
.os-card{
  margin:0 12px 10px;padding:16px;background:#fff;
  border-radius:12px;border:1.5px solid var(--border);
  border-left:4px solid var(--orange);box-shadow:var(--shadow);
}
.os-numero{font-size:13px;font-weight:800;color:var(--blue);margin-bottom:8px}
.os-cliente{font-size:11px;color:var(--muted);margin-bottom:6px}
.os-info{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-top:10px;
}
.os-info-item{background:#F0F4FF;padding:6px;border-radius:6px;text-align:center}
.os-info-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.os-info-value{font-size:14px;font-weight:800;color:var(--blue)}
.os-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.os-btn{flex:1;min-width:80px;padding:8px 12px;font-size:12px;font-weight:700;
        border-radius:6px;background:var(--orange);color:#fff}

/* Histórico */
.hist-item{
  display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--border);align-items:center;
}
.hist-date{
  text-align:center;font-size:11px;font-weight:800;color:var(--orange);
  min-width:32px;
}
.hist-body{flex:1}
.hist-equip{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.hist-horas{font-size:11px;color:var(--muted)}

/* Modal */
.modal-wrap{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;z-index:200;animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-inner{
  background:#fff;width:100%;border-radius:12px 12px 0 0;
  padding:24px;max-height:90dvh;overflow-y:auto;
}
.modal-title{font-size:16px;font-weight:800;color:var(--blue);margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:12px;background:none;color:var(--muted);
             font-size:24px;cursor:pointer}

/* Badge sincronização */
#badge-sincronizando{
  display:none;position:fixed;top:12px;right:12px;
  background:#FFF7ED;border:1px solid #EA580C;border-radius:20px;
  padding:8px 16px;font-size:12px;font-weight:700;color:#EA580C;
  z-index:1000;gap:8px;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.8}}

</style>
</head>
<body>

<!-- BADGE SINCRONIZAÇÃO -->
<div id="badge-sincronizando" style="display:none;position:fixed;top:12px;right:12px;background:#FFF7ED;border:1px solid #EA580C;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;color:#EA580C;z-index:1000;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);">
  ⏳ Sincronizando...
</div>

<!-- TELA LOGIN -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-fallback">G</div>
      <div style="font-size:13px;font-weight:700;color:var(--blue)">GARRA</div>
      <div style="font-size:9px;color:var(--muted);letter-spacing:.05em">SISTEMAS</div>
    </div>
    <h2 class="login-title">Operacional</h2>
    <p class="login-sub">Acesso ao módulo de operações</p>
    <div id="login-err" class="login-err"></div>
    <label class="field-label">Login</label>
    <input type="text" id="field-login" class="field-input" placeholder="seu.login@garra.local" autocomplete="username"/>
    <label class="field-label">Senha</label>
    <div class="field-pass-wrap">
      <input type="password" id="field-pass" class="field-input" placeholder="●●●●●●" autocomplete="current-password"/>
      <button class="btn-eye" onclick="togglePass()">👁</button>
    </div>
    <button class="btn-login" onclick="fazerLogin()">🚀 Entrar</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="screen-app" style="display:flex">
  <!-- HEADER -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="app-logo-g">G</div>
      <div>
        <div class="app-title">GARRA</div>
        <div class="app-modulo" id="app-modulo">Operacional</div>
      </div>
    </div>
    <div class="app-header-right">
      <div class="user-avatar" id="user-avatar">?</div>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <!-- CONTEÚDO -->
  <div class="app-content">
    <!-- JARDINAGEM -->
    <div id="sec-jard" class="mod-section active"></div>

    <!-- OPERACIONAL -->
    <div id="sec-op" class="mod-section">
      <div style="display:flex;border-bottom:2px solid var(--border);background:#fff;position:sticky;top:0;z-index:10">
        <button id="op-tab-os" class="nav-btn" style="border-bottom:3px solid var(--orange);color:var(--orange);flex:1;padding:12px" onclick="opTab('os')">📋 Minhas OS</button>
        <button id="op-tab-hist" class="nav-btn" style="border-bottom:3px solid transparent;color:var(--muted);flex:1;padding:12px" onclick="opTab('hist')">🕐 Histórico</button>
      </div>
      <div id="os-lista"></div>
    </div>

    <!-- CHECKLIST -->
    <div id="sec-check" class="mod-section" style="padding:0"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="ir('Jard')"><span class="nav-icon">🌿</span><span class="nav-label">Jardinagem</span></button>
    <button class="nav-btn" onclick="ir('Op')"><span class="nav-icon">⚙️</span><span class="nav-label">Operacional</span></button>
    <button class="nav-btn" onclick="ir('Check')"><span class="nav-icon">✓</span><span class="nav-label">Checklist</span></button>
  </div>
</div>

<!-- MODAIS -->
<div id="modal-parte" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;z-index:300;align-items:flex-end" onclick="fecharModalOp(event)">
  <div style="background:#fff;width:100%;border-radius:12px 12px 0 0;padding:24px;max-height:90dvh;overflow-y:auto">
    <h2 style="font-size:16px;font-weight:800;color:var(--blue);margin-bottom:16px">Registrar Dia</h2>
    <div id="m-error" style="background:#FEE2E2;color:var(--red);border-radius:6px;padding:10px;margin-bottom:16px;font-size:13px;display:none"></div>
    <!-- Conteúdo do modal aqui (omitido por brevidade) -->
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   GARRA OPERACIONAL — OFFLINE-FIRST COM GARRADB v2
   ══════════════════════════════════════════════════════════════════════════════ */

// ──────────────────────────────────────────────────────────────────────────────
// VARIÁVEIS GLOBAIS
// ──────────────────────────────────────────────────────────────────────────────
let USUARIO = null;
let _osAtualId = null;
let _opTab = 'os';

// ──────────────────────────────────────────────────────────────────────────────
// LOGIN
// ──────────────────────────────────────────────────────────────────────────────
async function fazerLogin() {
  const login = document.getElementById('field-login').value.trim();
  const pass = document.getElementById('field-pass').value;
  const errDiv = document.getElementById('login-err');

  if (!login || !pass) {
    errDiv.textContent = 'Preencha login e senha';
    errDiv.style.display = 'block';
    return;
  }

  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, senha: pass })
    });

    if (!r.ok) {
      const data = await r.json();
      throw new Error(data.detail || 'Erro ao fazer login');
    }

    const data = await r.json();
    localStorage.setItem('garra_token', data.token);
    localStorage.setItem('garra_usuario', JSON.stringify(data));

    USUARIO = data;
    document.getElementById('user-avatar').textContent = (data.nome || '?').charAt(0).toUpperCase();

    // Mostrar app
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display = 'flex';

    // Carregar módulos
    await carregarOSApp();
  } catch (e) {
    errDiv.textContent = e.message;
    errDiv.style.display = 'block';
  }
}

function fazerLogout() {
  localStorage.removeItem('garra_token');
  localStorage.removeItem('garra_usuario');
  location.reload();
}

function togglePass() {
  const field = document.getElementById('field-pass');
  field.type = field.type === 'password' ? 'text' : 'password';
}

// ──────────────────────────────────────────────────────────────────────────────
// NAVEGAÇÃO
// ──────────────────────────────────────────────────────────────────────────────
function ir(nome) {
  document.querySelectorAll('.mod-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (nome === 'Jard') {
    document.getElementById('sec-jard').classList.add('active');
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
    document.getElementById('app-modulo').textContent = 'Jardinagem';
  } else if (nome === 'Op') {
    document.getElementById('sec-op').classList.add('active');
    document.querySelectorAll('.nav-btn')[1].classList.add('active');
    document.getElementById('app-modulo').textContent = 'Operacional';
    carregarOSApp();
  } else if (nome === 'Check') {
    document.getElementById('sec-check').classList.add('active');
    document.querySelectorAll('.nav-btn')[2].classList.add('active');
    document.getElementById('app-modulo').textContent = 'Checklist';
  }
}

// ──────────────────────────────────────────────────────────────────────────────
// OPERACIONAL — CARREGAROSAPP COM OFFLINE
// ──────────────────────────────────────────────────────────────────────────────
async function carregarOSApp() {
  const el = document.getElementById('os-lista');
  el.innerHTML = '<div class="loading"><span class="spin"></span></div>';

  try {
    // ✅ OFFLINE-FIRST com GarraDB.fetchWithFallback
    const dados = await GarraDB.fetchWithFallback(
      '/operacional/api/minhas-os',
      {
        cacheKey: 'os_minhas_' + (USUARIO?.id || 'anonimo'),
        cacheTTL: 1800  // 30 min
      }
    );

    if (!dados) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📡</div><div class="empty-txt">Sem conexão</div><div class="empty-sub">Nenhum cache disponível</div></div>';
      return;
    }

    const osLista = dados.os || [];
    if (osLista.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">Nenhuma OS aberta</div><div class="empty-sub">Clique no botão + para abrir uma nova</div></div>';
      return;
    }

    let html = '';
    osLista.forEach(os => {
      html += `
        <div class="os-card">
          <div class="os-numero">${os.numero}</div>
          <div class="os-cliente">${os.cliente_nome || '(Cliente avulso)'}</div>
          <div class="os-info">
            <div class="os-info-item">
              <div class="os-info-label">Local</div>
              <div class="os-info-value" style="font-size:12px">${os.local_servico || '–'}</div>
            </div>
            <div class="os-info-item">
              <div class="os-info-label">Regime</div>
              <div class="os-info-value" style="font-size:12px">${os.regime_cobranca || '–'}</div>
            </div>
          </div>
          <div class="os-btns">
            <button class="os-btn" onclick="abrirModalParte('${os.id}')">📝 Registrar</button>
            <button class="os-btn" style="background:var(--blue)" onclick="verPartes('${os.id}', '${os.numero}')">👁 Ver</button>
          </div>
        </div>
      `;
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">❌</div><div class="empty-txt">Erro</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

// ──────────────────────────────────────────────────────────────────────────────
// OPERACIONAL — SALVARPARTE COM OFFLINE (GarraDB.postWithQueue)
// ──────────────────────────────────────────────────────────────────────────────
async function salvarParte(adicionarMais) {
  const err = document.getElementById('m-error');
  err.style.display = 'none';

  const data = document.getElementById('m-data').value;
  const equipId = document.getElementById('m-equipamento').value;
  const operadorId = document.getElementById('m-operador').value;

  if (!data) {
    err.textContent = 'Informe a data';
    err.style.display = 'block';
    return;
  }
  if (!equipId) {
    err.textContent = 'Selecione o equipamento';
    err.style.display = 'block';
    return;
  }

  const sel = document.getElementById('m-equipamento');
  const cat = sel.options[sel.selectedIndex]?.getAttribute('data-cat') || '';
  const isCaminhao = ['caminhao','pipa','carro'].includes(cat);

  const hIni = document.getElementById('m-h-ini').value;
  const hFin = document.getElementById('m-h-fin').value;
  const kmIni = document.getElementById('m-km-ini').value;
  const kmFin = document.getElementById('m-km-fin').value;

  if (!isCaminhao && hIni && hFin && parseFloat(hFin) < parseFloat(hIni)) {
    err.textContent = 'Horímetro final menor que o inicial';
    err.style.display = 'block';
    return;
  }

  const payload = {
    data,
    equipamento_id: equipId,
    operador_id: operadorId || null,
    tipo_medicao: isCaminhao ? 'km' : 'horimetro',
    horimetro_inicial: hIni ? parseFloat(hIni) : null,
    horimetro_final: hFin ? parseFloat(hFin) : null,
    km_inicial: kmIni ? parseFloat(kmIni) : null,
    km_final: kmFin ? parseFloat(kmFin) : null,
    qtd_viagens: parseFloat(document.getElementById('m-viagens').value || '0') || 0,
    hora_inicio: document.getElementById('m-h-inicio').value || null,
    hora_fim: document.getElementById('m-h-fim').value || null,
    trajeto: document.getElementById('m-trajeto').value.trim() || null,
    por_conta_de: document.getElementById('m-por-conta').value || 'empresa',
    observacao: document.getElementById('m-obs').value.trim() || null,
  };

  const btn1 = document.getElementById('btn-salvar-parte');
  const btn2 = document.getElementById('btn-salvar-mais');
  btn1.textContent = 'Salvando...';
  btn1.disabled = true;
  btn2.disabled = true;

  try {
    // ✅ OFFLINE-FIRST com GarraDB.postWithQueue
    const result = await GarraDB.postWithQueue(
      '/operacional/api/os/' + _osAtualId + '/partes',
      payload,
      {
        retries: 5,
        retryDelay: 30000,
        dedup: 'url+method'
      }
    );

    if (result.success) {
      toast('✓ Registro salvo!', 'success');

      if (adicionarMais) {
        ['m-equipamento','m-operador','m-h-ini','m-h-fin','m-km-ini','m-km-fin',
         'm-viagens','m-h-inicio','m-h-fim','m-trajeto','m-obs'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
        document.getElementById('m-por-conta').value = 'empresa';
      } else {
        fecharModalDireto();
      }
    } else if (result.queued) {
      toast('⚠️ Offline - será sincronizado quando voltar online', 'info');
      if (!adicionarMais) fecharModalDireto();
    } else {
      toast('❌ Erro ao salvar', 'error');
    }

    carregarOSApp();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn1.textContent = '✅ Salvar registro';
    btn1.disabled = false;
    btn2.disabled = false;
  }
}

// ──────────────────────────────────────────────────────────────────────────────
// OPERACIONAL — SALVARNOVA OS COM OFFLINE
// ──────────────────────────────────────────────────────────────────────────────
async function salvarNovaOS() {
  const err = document.getElementById('nos-err');
  err.style.display = 'none';
  const obra = document.getElementById('nos-obra').value.trim();

  if (!obra) {
    err.textContent = 'Informe a obra / local';
    err.style.display = 'block';
    return;
  }

  const payload = {
    obra,
    cliente_nome_avulso: document.getElementById('nos-cliente').value.trim() || null,
    regime_cobranca: document.getElementById('nos-regime').value,
    origem: 'campo',
  };

  const btn = document.getElementById('nos-btn');
  btn.textContent = 'Salvando...';
  btn.disabled = true;

  try {
    // ✅ OFFLINE-FIRST
    const result = await GarraDB.postWithQueue(
      '/operacional/api/os',
      payload,
      { retries: 5, retryDelay: 30000 }
    );

    if (result.success) {
      toast('✓ OS aberta!', 'success');
      fecharSheetNovaOS();
      carregarOSApp();
    } else if (result.queued) {
      toast('⚠️ OS será criada ao conectar', 'info');
      fecharSheetNovaOS();
    } else {
      err.textContent = result.error || 'Erro ao salvar';
      err.style.display = 'block';
    }
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.textContent = '✅ Abrir OS';
    btn.disabled = false;
  }
}

// INIT

document.addEventListener('DOMContentLoaded', async () => {
  // Registrar Service Worker v8
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js', { scope: '/operacional/' })
      .then(reg => console.log('[App] SW v8 registrado'))
      .catch(err => console.error('[App] SW erro:', err));
  }

  // Inicializar GarraDB
  await GarraDB.init();
  console.log('[App] GarraDB inicializado');

  // Verificar se já está logado
  const token = localStorage.getItem('garra_token');
  const usuario = localStorage.getItem('garra_usuario');
  if (token && usuario) {
    USUARIO = JSON.parse(usuario);
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display = 'flex';
    document.getElementById('user-avatar').textContent = (USUARIO.nome || '?').charAt(0).toUpperCase();
    carregarOSApp();
  }
});

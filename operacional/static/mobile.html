<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1A2A5E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Garra — Mobile</title>
<link rel="manifest" href="/mobile/manifest.json"/>
<link rel="icon" href="/static/icons/favicon.ico"/>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0F4FF;color:#1E293B;
     min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none;border:none}

/* ── CSS VARS ── */
:root{
  --blue:    #1A2A5E;
  --blue2:   #1E3A8A;
  --orange:  #E8820C;
  --bg:      #F0F4FF;
  --card:    #FFFFFF;
  --border:  #CBD5E1;
  --text:    #1E293B;
  --muted:   #64748B;
  --green:   #16A34A;
  --red:     #DC2626;
  --radius:  12px;
  --shadow:  0 2px 12px rgba(26,42,94,.08);
  --nav-h:   64px;
}

/* ── TELA LOGIN ── */
#screen-login{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;background:#F0F4FF;
}
.login-card{
  background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;
  box-shadow:0 4px 24px rgba(26,42,94,.10);border:1.5px solid var(--border);
}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:56px;object-fit:contain}
.login-logo-fallback{
  width:56px;height:56px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--orange);margin:0 auto 8px;
}
.login-title{font-size:20px;font-weight:800;color:var(--blue);text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;
             letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:block}
.field-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-size:15px;color:var(--text);background:#fff;
  transition:.15s;margin-bottom:14px;
}
.field-input:focus{border-color:var(--blue)}
.field-pass-wrap{position:relative;margin-bottom:20px}
.field-pass-wrap .field-input{margin-bottom:0;padding-right:44px}
.btn-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;font-size:18px;color:var(--muted);padding:4px;
}
.btn-login{
  width:100%;padding:14px;background:var(--blue);color:#fff;
  border-radius:8px;font-size:15px;font-weight:700;letter-spacing:.02em;
}
.btn-login:active{opacity:.85}
.login-err{
  background:#FEE2E2;color:var(--red);border-radius:8px;
  padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
  display:none;
}

/* ── APP SHELL ── */
#screen-app{display:none;flex-direction:column;min-height:100dvh}

/* Header */
.app-header{
  background:var(--blue);border-bottom:3px solid var(--orange);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.app-header-left{display:flex;align-items:center;gap:10px}
.app-logo-g{
  width:32px;height:32px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;
}
.app-title{font-size:15px;font-weight:800;color:#fff}
.app-modulo{font-size:11px;color:#93C5FD;font-weight:500}
.app-header-right{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:30px;height:30px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
}
.btn-sair{
  background:rgba(255,255,255,.15);color:#fff;border-radius:6px;
  padding:5px 10px;font-size:12px;font-weight:600;
}

/* Conteúdo principal */
.app-content{
  flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 8px);
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:#fff;border-top:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  z-index:100;box-shadow:0 -2px 12px rgba(26,42,94,.06);
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 16px;background:none;color:var(--muted);
  font-size:10px;font-weight:600;border-radius:8px;transition:.15s;flex:1;
}
.nav-btn.active{color:var(--orange)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:22px;line-height:1;transition:.15s}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.02em}

/* Seções */
.mod-section{display:none;min-height:calc(100dvh - 120px)}
.mod-section.active{display:block}

/* ── COMPONENTES COMUNS ── */
.card{
  background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin:12px 12px 0;
}
.page-title{
  font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);padding:16px 16px 8px;
}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;
         flex-direction:column;gap:10px;color:var(--muted);font-size:13px}
.spin{width:24px;height:24px;border:3px solid var(--border);
      border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px;font-weight:600}
.empty-sub{font-size:12px;margin-top:4px}

/* Checklist iframe */
#sec-check iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  border-radius: 0;
}

/* Toast */
.toast-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
            z-index:9999;pointer-events:none;width:90%;max-width:320px;text-align:center}
.toast{
  display:inline-block;padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:700;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .2s ease;
  margin-bottom:8px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--blue)}

/* Botões */
.btn-primary{
  background:var(--orange);color:#fff;border-radius:8px;
  padding:12px 20px;font-size:14px;font-weight:700;width:100%;
  box-shadow:0 4px 12px rgba(232,130,12,.3);
}
.btn-primary:active{opacity:.85}
.btn-secondary{
  background:#F0F4FF;color:var(--blue);border-radius:8px;
  padding:12px 20px;font-size:14px;font-weight:700;border:1.5px solid var(--border);
}

/* ── SEÇÃO: JARDINAGEM ── */
#sec-jard .jard-tabs{
  display:flex;border-bottom:2px solid var(--border);
  background:#fff;position:sticky;top:63px;z-index:10;
}
#sec-jard .tab{
  flex:1;padding:12px;font-size:12px;font-weight:700;
  color:var(--muted);background:none;border-bottom:3px solid transparent;
  margin-bottom:-2px;text-align:center;
}
#sec-jard .tab.active{color:var(--orange);border-bottom-color:var(--orange)}

/* ── SEÇÃO: OPERACIONAL ── */
.os-card{
  margin:0 12px 10px;padding:16px;background:#fff;
  border-radius:12px;border:1.5px solid var(--border);
  box-shadow:var(--shadow);
}
.os-num{font-size:12px;font-weight:800;color:var(--blue)}
.os-obra{font-size:15px;font-weight:700;color:var(--text);margin:4px 0}
.os-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.os-badge{
  display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;
  border-radius:99px;
}
.badge-hora{background:#DBEAFE;color:#1D4ED8}
.badge-diaria{background:#FFF7ED;color:#EA580C}
.badge-empreito{background:#DCFCE7;color:#16A34A}
.btn-reg{
  width:100%;padding:12px;background:var(--orange);color:#fff;
  border-radius:8px;font-size:14px;font-weight:700;margin-top:12px;
  box-shadow:0 4px 12px rgba(232,130,12,.25);
}

/* Modal/Sheet */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:none;align-items:flex-end;
}
.sheet-backdrop.open{display:flex}
.sheet{
  background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;
  width:100%;max-height:90dvh;overflow-y:auto;
}
.sheet-handle{width:40px;height:4px;background:#CBD5E1;border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:800;color:var(--blue);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;
             letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-size:15px;color:var(--text);background:#fff;
}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-calc{font-size:13px;font-weight:700;color:var(--green);padding:8px 0}
.field-err{font-size:12px;color:var(--red);font-weight:600;display:none;padding:6px 0}

/* ── SEÇÃO: CHECKLIST ── */
#sec-check .check-placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:60px 24px;text-align:center;
}
</style>
</head>
<body>

<!-- ═══════════ TELA DE LOGIN ═══════════ -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">
      <img src="/static/icons/logo.png" alt="Garra"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"/>
      <div class="login-logo-fallback" id="logo-fallback" style="display:none">G</div>
    </div>
    <div class="login-title">Garra</div>
    <div class="login-sub">Acesse com seu usuário</div>
    <div class="login-err" id="login-err"></div>
    <label class="field-label">Usuário</label>
    <input class="field-input" id="l-user" type="text" placeholder="nome@garra.local"
           autocomplete="username" autocapitalize="none"/>
    <label class="field-label">Senha</label>
    <div class="field-pass-wrap">
      <input class="field-input" id="l-pass" type="password" placeholder="••••"
             autocomplete="current-password"/>
      <button class="btn-eye" onclick="togglePass()">👁</button>
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ═══════════ APP SHELL ═══════════ -->
<div id="screen-app">

  <!-- Header -->
  <header class="app-header">
    <div class="app-header-left">
      <div class="app-logo-g">G</div>
      <div>
        <div class="app-title">GARRA</div>
        <div class="app-modulo" id="app-modulo-label">Carregando...</div>
      </div>
    </div>
    <div class="app-header-right">
      <div style="position:relative">
        <div id="sync-badge" style="width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;display:inline-block" title="Online"></div>
        <div id="sync-count" style="display:none;position:absolute;top:-4px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;font-size:9px;font-weight:800;align-items:center;justify-content:center"></div>
      </div>
      <div class="user-avatar" id="user-avatar">?</div>
      <button class="btn-sair" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <!-- Conteúdo -->
  <div class="app-content" id="app-content">
    <!-- Seções carregadas dinamicamente -->
  </div>

  <!-- Bottom Nav (dinâmica) -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

</div>

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<script src="idb.js"></script>
<script>
/* ════════════════════════════════════════════
   SERVICE WORKER + OFFLINE
════════════════════════════════════════════ */
// Registrar SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/mobile/sw.js')
    .then(reg => {
      console.log('SW registrado:', reg.scope);
      // Escutar mensagens do SW
      navigator.serviceWorker.addEventListener('message', event => {
        const { type, pending } = event.data || {};
        if (type === 'SYNC_SUCCESS') toast('✅ Registro sincronizado!', 'success');
        if (type === 'QUEUE_STATUS') atualizarBadgeSync(pending);
      });
    })
    .catch(err => console.warn('SW erro:', err));
}

// Monitor de conexão
let _online = navigator.onLine;
window.addEventListener('online',  () => { _online = true;  atualizarStatusOnline(); syncPendentes(); });
window.addEventListener('offline', () => { _online = false; atualizarStatusOnline(); });

function atualizarStatusOnline() {
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  badge.style.background = _online ? 'var(--green)' : 'var(--red)';
  badge.title = _online ? 'Online' : 'Offline — registros serão sincronizados quando conectar';
}

function atualizarBadgeSync(pending) {
  const badge = document.getElementById('sync-count');
  if (!badge) return;
  badge.textContent = pending > 0 ? pending : '';
  badge.style.display = pending > 0 ? 'flex' : 'none';
}

async function syncPendentes() {
  if (!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'SYNC_NOW' });
}

/* ════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════ */
const API = (location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? 'http://localhost:8000' : 'https://garra-sistemas.onrender.com';

/* ════════════════════════════════════════════
   TOKEN & STORAGE
════════════════════════════════════════════ */
const Token = {
  get:     ()  => localStorage.getItem('garra_token'),
  set:     (t) => localStorage.setItem('garra_token', t),
  del:     ()  => localStorage.removeItem('garra_token'),
  user:    ()  => { try { return JSON.parse(localStorage.getItem('garra_usuario')||'null'); } catch { return null; }},
  setUser: (u) => localStorage.setItem('garra_usuario', JSON.stringify(u)),
  delUser: ()  => localStorage.removeItem('garra_usuario'),
};

/* ════════════════════════════════════════════
   API FETCH
════════════════════════════════════════════ */
async function api(path, opts={}) {
  const token = Token.get();
  const res = await fetch(API+path, {
    ...opts,
    headers: {
      'Content-Type':'application/json',
      ...(token ? {'Authorization':'Bearer '+token} : {}),
      ...(opts.headers||{}),
    },
  });
  if (res.status===401) { doLogout(); throw new Error('Sessão expirada'); }
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    throw new Error(e.detail||'Erro '+res.status);
  }
  return res.json();
}

/* ════════════════════════════════════════════
   TOAST
════════════════════════════════════════════ */
function toast(msg, type='info') {
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

/* ════════════════════════════════════════════
   MÓDULOS DISPONÍVEIS
════════════════════════════════════════════ */
const MODULOS = [
  {
    id: 'jardinagem_mobile',
    icon: '📷', label: 'Jardinagem',
    perfis: ['campo','admin','gestor','luana'],
    render: renderJardinagem,
  },
  {
    id: 'operacional_mobile',
    icon: '🚛', label: 'Operacional',
    perfis: ['operador','motorista','admin','gestor','luana'],
    render: renderOperacional,
  },
  {
    id: 'checklist',
    icon: '✅', label: 'Checklist',
    perfis: ['operador','motorista','admin'],
    render: renderChecklist,
  },
  {
    id: 'checklist_logistica',
    icon: '🚗', label: 'Logística',
    render: renderLogistica,
  },
];

const PERFIL_PADRAO = {
  admin:     ['jardinagem_mobile','operacional_mobile','checklist'],
  gestor:    ['jardinagem_mobile','operacional_mobile'],
  luana:     ['jardinagem_mobile','operacional_mobile'],
  campo:     ['jardinagem_mobile'],
  operador:  ['operacional_mobile','checklist'],
  motorista: ['operacional_mobile','checklist'],
};

/* ════════════════════════════════════════════
   LOGIN
════════════════════════════════════════════ */
function togglePass() {
  const f = document.getElementById('l-pass');
  f.type = f.type==='password' ? 'text' : 'password';
}

async function doLogin() {
  const login = document.getElementById('l-user').value.trim();
  const senha = document.getElementById('l-pass').value;
  const err   = document.getElementById('login-err');
  const btn   = document.getElementById('btn-login');
  err.style.display = 'none';
  if (!login||!senha) { err.textContent='Preencha usuário e senha'; err.style.display='block'; return; }
  btn.textContent='Entrando...'; btn.disabled=true;
  try {
    const data = await fetch(API+'/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({login, senha}),
    }).then(async r => {
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||'Credenciais inválidas');
      return r.json();
    });
    Token.set(data.token);
    Token.setUser({login:data.login, nome:data.nome, perfil:data.perfil, id:data.id||null});
    iniciarApp(data);
  } catch(e) {
    err.textContent = e.message; err.style.display='block';
  } finally { btn.textContent='Entrar'; btn.disabled=false; }
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter') doLogin();
});

/* ════════════════════════════════════════════
   LOGOUT
════════════════════════════════════════════ */
function doLogout() {
  if (!confirm('Sair do aplicativo?')) return;
  Token.del(); Token.delUser();
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
}

/* ════════════════════════════════════════════
   INIT — verifica token existente
════════════════════════════════════════════ */
window.addEventListener('load', async () => {
  const token = Token.get();
  const user  = Token.user();
  if (token && user) {
    // Renovar token silenciosamente
    try {
      const res = await fetch(API+'/auth/renovar', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      });
      if (res.ok) {
        const d = await res.json();
        if (d.token) Token.set(d.token);
        iniciarApp(user);
        return;
      }
    } catch {}
    // Token inválido — pedir login
    Token.del(); Token.delUser();
  }
  document.getElementById('screen-login').style.display = 'flex';
});

/* ════════════════════════════════════════════
   INICIAR APP
════════════════════════════════════════════ */
let _USER = null;
let _PERMS = [];
let _MOD_ATUAL = null;

async function iniciarApp(user) {
  _USER = user;
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display   = 'flex';
  document.getElementById('user-avatar').textContent = (user.nome||user.login||'?').charAt(0).toUpperCase();

  // Buscar permissões do banco
  let permsDB = {};
  try {
    if (user.id) permsDB = await api('/permissoes/usuario/'+user.id);
  } catch {}

  // Determinar módulos liberados
  const padrao = PERFIL_PADRAO[user.perfil] || [];
  _PERMS = MODULOS.filter(m => {
    if (permsDB[m.id] !== undefined) return permsDB[m.id];
    return padrao.includes(m.id);
  });

  if (!_PERMS.length) {
    document.getElementById('app-content').innerHTML =
      '<div class="empty" style="padding:60px 24px"><div class="empty-icon">🔒</div>' +
      '<div class="empty-txt">Sem módulos disponíveis</div>' +
      '<div class="empty-sub">Fale com o administrador</div></div>';
    document.getElementById('bottom-nav').innerHTML = '';
    return;
  }

  // Renderizar bottom nav
  renderNav();

  // Abrir primeiro módulo
  abrirModulo(_PERMS[0].id);
}

/* ════════════════════════════════════════════
   NAVEGAÇÃO
════════════════════════════════════════════ */
function renderNav() {
  const nav = document.getElementById('bottom-nav');
  nav.innerHTML = _PERMS.map(m => `
    <button class="nav-btn ${m.id===_MOD_ATUAL?'active':''}" id="nav-${m.id}"
      onclick="abrirModulo('${m.id}')">
      <span class="nav-icon">${m.icon}</span>
      <span class="nav-label">${m.label}</span>
    </button>`).join('');
}

function abrirModulo(id) {
  _MOD_ATUAL = id;
  const mod = _PERMS.find(m=>m.id===id);
  if (!mod) return;

  // Atualizar nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

// Carrega equipamentos: tenta rede, grava cópia local (IndexedDB),
// e se a rede falhar usa a última cópia salva — funciona offline.
async function carregarEquipamentos(force) {
  if (_equipamentos.length && !force) return _equipamentos;
  const token = Token.get();
  const result = await GarraDB.fetchWithFallback(
    API + '/operacional/api/equipamentos',
    { headers: { 'Authorization': 'Bearer ' + token } },
    GarraDB.STORES.cache_equipamentos,
    { isList: true }
  );
  _equipamentos = result.data || [];
  if (result._offline) {
    console.warn('[Operacional] equipamentos carregados do cache local (sem rede)');
  }
  return _equipamentos;
}

async function carregarLogistica() {
  try {
    const [equipamentos, usuarios, registros] = await Promise.all([
      api('/operacional/api/equipamentos'),
      api('/usuarios'),
      api('/logistica/registros?limit=20'),
    ]);
    _logCarros = (equipamentos || []).filter(e => ['carro','pickup','carro_apoio'].includes((e.categoria||'').toLowerCase()));
    _logMotoristas = (usuarios || []).filter(u => u.ativo);
    _logRegistros = registros || [];
  } catch(e) {
    _logCarros = []; _logMotoristas = []; _logRegistros = [];
  }
  renderLogFrotaAtual();
  renderLogHistoricoLista();
}

function logStatusAtualPorCarro() {
  // Para cada carro, encontra o registro mais recente que o menciona
  const status = {};
  // _logRegistros já vem ORDER BY data_hora DESC do backend
  _logRegistros.forEach(reg => {
    (reg.carros || []).forEach(c => {
      if (!status[c.id]) status[c.id] = { ...c, data_hora: reg.data_hora, responsavel: reg.responsavel };
    });
  });
  return status;
}

function renderLogFrotaAtual() {
  const el = document.getElementById('log-frota-atual');
  if (!el) return;
  const status = logStatusAtualPorCarro();
  const emCampo = _logCarros.filter(c => status[c.id] && status[c.id].status === 'em_campo').length;
  const disponiveis = _logCarros.length - emCampo;
  const kc = document.getElementById('log-kpi-campo'); if (kc) kc.textContent = emCampo;
  const kd = document.getElementById('log-kpi-disp');  if (kd) kd.textContent = disponiveis;

  if (!_logCarros.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🚗</div><div class="empty-txt">Nenhum carro de apoio cadastrado</div><div class="empty-sub">Cadastre em Equipamentos, categoria "carro"</div></div>`;
    return;
  }
  el.innerHTML = _logCarros.map(c => {
    const st = status[c.id];
    const emUso = st && st.status === 'em_campo';
    return `<div style="background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--text)">🚗 ${esc(c.codigo)} — ${esc(c.descricao||'')}</div>
        ${st ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(st.driver||'—')} ${st.dest?'→ '+esc(st.dest):''}</div>` : '<div style="font-size:11px;color:var(--muted);margin-top:2px">Sem registro</div>'}
      </div>
      <span class="badge" style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;${emUso?'background:#FFF7ED;color:#EA580C':'background:#DCFCE7;color:#16A34A'}">${emUso?'Em campo':'Disponível'}</span>
    </div>`;
  }).join('');
}

function renderLogHistoricoLista() {
  const el = document.getElementById('log-historico');
  if (!el) return;
  if (!_logRegistros.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🕐</div><div class="empty-txt">Nenhum registro ainda</div></div>`;
    return;
  }
  el.innerHTML = _logRegistros.slice(0, 15).map(reg => {
    const data = reg.data_hora ? new Date(reg.data_hora).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const carros = (reg.carros||[]).map(c => esc(c.id)).join(', ');
    return `<div style="background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px">
      <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(reg.responsavel)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${data} — ${carros||'—'}</div>
    </div>`;
  }).join('');
}

      <div class="field">
        <label>Status</label>
        <select id="${rowId}-status">
          <option value="em_campo">Em campo</option>
          <option value="disponivel">Disponível</option>
        </select>
      </div>
      <div class="field">
        <label>Motorista</label>
        <select id="${rowId}-driver"><option value="">—</option>${driverOpts}</select>
      </div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Destino / Observação</label>
      <input type="text" id="${rowId}-dest" placeholder="Ex.: Obra Rua X"/>
    </div>`;
  document.getElementById('log-car-rows').appendChild(row);
}

async function salvarNovoRegLog() {
  const err = document.getElementById('log-reg-err');
  err.style.display = 'none';
  const resp = document.getElementById('log-resp').value;
  const dataHora = document.getElementById('log-datahora').value;
  if (!resp)     { err.textContent = 'Selecione o responsável'; err.style.display = 'block'; return; }
  if (!dataHora) { err.textContent = 'Informe a data/hora';     err.style.display = 'block'; return; }

  const rows = document.querySelectorAll('#log-car-rows .log-car-row');
  const carros = [];
  rows.forEach(row => {
    const id     = document.getElementById(row.id + '-car')?.value;
    const status = document.getElementById(row.id + '-status')?.value;
    const driver = document.getElementById(row.id + '-driver')?.value || '';
    const dest   = document.getElementById(row.id + '-dest')?.value.trim() || '';
    if (id) carros.push({ id, status, driver, dest });
  });
  if (!carros.length) { err.textContent = 'Adicione ao menos um carro'; err.style.display = 'block'; return; }

  const payload = {
    registro_id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    responsavel: resp,
    data_hora: new Date(dataHora).toISOString(),
    carros,
  };

  const btn = document.getElementById('log-reg-btn');
  btn.textContent = 'Salvando...'; btn.disabled = true;
  try {
    await api('/logistica/registros', { method: 'POST', body: JSON.stringify(payload) });
    toast('Registro salvo!', 'success');
    fecharSheetNovoRegLog();
    await carregarLogistica();
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally {
    btn.textContent = '✅ Salvar registro'; btn.disabled = false;
  }
}

/* ════════════════════════════════════════════
   UTILITÁRIOS
════════════════════════════════════════════ */

/* ═══ OPERACIONAL ═══ */
const REGIME_CFG = {
  hora:     { label:'Por hora',    badge:'rb-hora',     icon:'⏱' },
  diaria:   { label:'Por diária',  badge:'rb-diaria',   icon:'📅' },
  empreito: { label:'Empreito',    badge:'rb-empreito', icon:'🔒' },
};

async function carregarOSApp() {
  const el = document.getElementById('os-lista');
  el.innerHTML = '<div class="loading"><span class="spin"></span></div>';
  await carregarListasRegistro();
  try {
    _osList = await api('/operacional/api/minhas-os');
  } catch(e) { _osList = []; }
  renderOS();
}

function renderOS() {
  const el = document.getElementById('os-lista');
  if (!_osList.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Nenhuma OS ativa</div>
      <div class="empty-sub">Quando a Luana abrir uma OS para você, ela aparece aqui</div>
    </div>`;
    return;
  }
  el.innerHTML = _osList.map(os => {
    const reg = REGIME_CFG[os.regime_cobranca] || REGIME_CFG.hora;
    const data = os.data_inicio ? new Date(os.data_inicio+'T00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
    return `<div class="os-card regime-${os.regime_cobranca||'hora'}">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="os-numero">${esc(os.numero)}</span>
        <span class="badge os-regime-badge ${reg.badge}">${reg.icon} ${reg.label}</span>
      </div>
      <div class="os-obra">${esc(os.obra)}</div>
      <div class="os-cliente">📍 ${esc(os.cliente_nome||'–')}</div>
      ${os.equipamento_codigo ? `<div class="os-equip">🚜 ${esc(os.equipamento_codigo)} — ${esc(os.equipamento_descricao||'')}</div>` : ''}
      ${data ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">📅 Início: ${data}</div>` : ''}
      <div class="os-actions">
        <button class="btn-reg" onclick="abrirRegistro('${esc(os.id)}')">
          ⏱ Registrar dia
        </button>
        <button class="btn-ver" onclick="verPartes('${esc(os.id)}','${esc(os.numero)}')">
          Ver registros
        </button>
      </div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════
   REGISTRAR PARTE DIÁRIA
══════════════════════════════════════════ */

async function carregarListasRegistro() {
  if (!_equipamentos.length) {
    await carregarEquipamentos();
  }
  if (!_operadores.length) {
    try { _operadores = await api('/operacional/api/operadores'); } catch {}
  }
}

function abrirRegistro(osId) {
  _osAtualId = osId;
  const os = _osList.find(o => o.id === osId);
  document.getElementById('modal-titulo').textContent = os ? os.numero + ' — ' + os.obra.slice(0,28) : 'Registrar dia';
  document.getElementById('m-os-id').value = osId;

  // Data default = hoje
  document.getElementById('m-data').value = new Date().toISOString().slice(0,10);

  // Popular selects
  const selEq = document.getElementById('m-equipamento');
  selEq.innerHTML = '<option value="">Selecione...</option>' +
    _equipamentos.map(e => `<option value="${e.id}" data-cat="${e.categoria}" data-codigo="${esc(e.codigo)}">${esc(e.codigo)} — ${esc(e.descricao)}</option>`).join('');

  const selOp = document.getElementById('m-operador');
  selOp.innerHTML = '<option value="">Selecione...</option>' +
    _operadores.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('');

  // Limpar campos
  ['m-h-ini','m-h-fin','m-km-ini','m-km-fin','m-viagens','m-h-inicio','m-h-fim','m-trajeto','m-obs'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('m-por-conta').value = 'empresa';
  document.getElementById('horas-calc').style.display = 'none';
  document.getElementById('bloco-horimetro').style.display = 'none';
  document.getElementById('bloco-km').style.display = 'none';
  document.getElementById('m-tipo-badge').textContent = '–';
  document.getElementById('m-error').style.display = 'none';

  document.getElementById('modal-parte').style.display = 'flex';
}

function onEquipChange() {
  const sel = document.getElementById('m-equipamento');
  const opt = sel.options[sel.selectedIndex];
  const cat = opt ? opt.getAttribute('data-cat') : '';
  const cod = opt ? opt.getAttribute('data-codigo') : '';

  const isCaminhao = ['caminhao','pipa','carro'].includes(cat);
  document.getElementById('bloco-horimetro').style.display = isCaminhao ? 'none' : (cat ? 'block' : 'none');
  document.getElementById('bloco-km').style.display        = isCaminhao ? 'block' : 'none';

  const badge = document.getElementById('m-tipo-badge');
  if (!cat) { badge.textContent = '–'; badge.style.color = 'var(--muted)'; }
  else if (isCaminhao) { badge.textContent = '🚛 KM'; badge.style.color = 'var(--orange)'; }
  else { badge.textContent = '⏱ Hr'; badge.style.color = 'var(--blue)'; }
}

function calcHoras() {
  const ini = parseFloat(document.getElementById('m-h-ini').value);
  const fin = parseFloat(document.getElementById('m-h-fin').value);
  const el  = document.getElementById('horas-calc');
  if (!isNaN(ini) && !isNaN(fin) && fin > ini) {
    el.textContent = `✅ ${(fin-ini).toFixed(1)} horas trabalhadas`;
    el.style.color = 'var(--green)';
    el.style.display = 'block';
  } else if (!isNaN(ini) && !isNaN(fin) && fin <= ini && fin !== ini) {
    el.textContent = '⚠️ Horímetro final deve ser maior que o inicial';
    el.style.color = 'var(--red)';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

async function salvarParte(adicionarMais) {
  const err = document.getElementById('m-error');
  err.style.display = 'none';

  const data        = document.getElementById('m-data').value;
  const equipId     = document.getElementById('m-equipamento').value;
  const operadorId  = document.getElementById('m-operador').value;

  if (!data)    { err.textContent='Informe a data';        err.style.display='block'; return; }
  if (!equipId) { err.textContent='Selecione o equipamento'; err.style.display='block'; return; }

  // Detectar tipo de medição pelo equipamento selecionado
  const sel = document.getElementById('m-equipamento');
  const cat = sel.options[sel.selectedIndex]?.getAttribute('data-cat') || '';
  const isCaminhao = ['caminhao','pipa','carro'].includes(cat);

  const hIni = document.getElementById('m-h-ini').value;
  const hFin = document.getElementById('m-h-fin').value;
  const kmIni= document.getElementById('m-km-ini').value;
  const kmFin= document.getElementById('m-km-fin').value;

  if (!isCaminhao && hIni && hFin && parseFloat(hFin) < parseFloat(hIni)) {
    err.textContent = 'Horímetro final menor que o inicial';
    err.style.display = 'block';
    return;
  }

  const payload = {
    data,
    equipamento_id:    equipId,
    operador_id:       operadorId || null,
    tipo_medicao:      isCaminhao ? 'km' : 'horimetro',
    horimetro_inicial: hIni ? parseFloat(hIni) : null,
    horimetro_final:   hFin ? parseFloat(hFin) : null,
    km_inicial:        kmIni ? parseFloat(kmIni) : null,
    km_final:          kmFin ? parseFloat(kmFin) : null,
    qtd_viagens:       parseFloat(document.getElementById('m-viagens').value||'0') || 0,
    hora_inicio:       document.getElementById('m-h-inicio').value || null,
    hora_fim:          document.getElementById('m-h-fim').value    || null,
    trajeto:           document.getElementById('m-trajeto').value.trim() || null,
    por_conta_de:      document.getElementById('m-por-conta').value || 'empresa',
    observacao:        document.getElementById('m-obs').value.trim() || null,
  };

  const btn1 = document.getElementById('btn-salvar-parte');
  const btn2 = document.getElementById('btn-salvar-mais');
  btn1.textContent='Salvando...'; btn1.disabled=true;
  btn2.disabled=true;

  try {
    await api('/operacional/api/os/' + _osAtualId + '/partes', {
      method:'POST', body:JSON.stringify(payload)
    });
    toast('Registro salvo!', 'success');

    if (adicionarMais) {
      // Limpa só os campos de medição — mantém data e OS
      ['m-equipamento','m-operador','m-h-ini','m-h-fin','m-km-ini','m-km-fin',
       'm-viagens','m-h-inicio','m-h-fim','m-trajeto','m-obs'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('m-por-conta').value = 'empresa';
      document.getElementById('bloco-horimetro').style.display = 'none';
      document.getElementById('bloco-km').style.display = 'none';
      document.getElementById('m-tipo-badge').textContent = '–';
      document.getElementById('horas-calc').style.display = 'none';
    } else {
      fecharModalDireto();
    }
  } catch(e) {
    err.textContent = e.message; err.style.display='block';
  } finally {
    btn1.textContent='✅ Salvar registro'; btn1.disabled=false;
    btn2.disabled=false;
  }
}

/* ══════════════════════════════════════════
   NOVA OS (operador abre OS avulsa no campo)
══════════════════════════════════════════ */
function abrirSheetNovaOS() {
  document.getElementById('nos-obra').value = '';
  document.getElementById('nos-cliente').value = '';
  document.getElementById('nos-regime').value = 'hora';
  document.getElementById('nos-err').style.display = 'none';
  document.getElementById('sheet-nova-os').classList.add('open');
}

function fecharSheetNovaOS(e) {
  if (e && e.target.id !== 'sheet-nova-os') return;
  document.getElementById('sheet-nova-os').classList.remove('open');
}

async function salvarNovaOS() {
  const err  = document.getElementById('nos-err');
  err.style.display = 'none';
  const obra = document.getElementById('nos-obra').value.trim();
  if (!obra) { err.textContent = 'Informe a obra / local'; err.style.display = 'block'; return; }

  const payload = {
    obra,
    cliente_nome_avulso: document.getElementById('nos-cliente').value.trim() || null,
    regime_cobranca: document.getElementById('nos-regime').value,
    origem: 'campo',
  };

  const btn = document.getElementById('nos-btn');
  btn.textContent = 'Salvando...'; btn.disabled = true;
  try {
    await api('/operacional/api/os', { method: 'POST', body: JSON.stringify(payload) });
    toast('OS aberta!', 'success');
    fecharSheetNovaOS();
    await carregarOSApp();
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally {
    btn.textContent = '✅ Abrir OS'; btn.disabled = false;
  }
}

/* ══════════════════════════════════════════
   ABAS: MINHAS OS / HISTÓRICO
══════════════════════════════════════════ */
let _opTab = 'os';
function opTab(tab) {
  _opTab = tab;
  const btnOs   = document.getElementById('op-tab-os');
  const btnHist = document.getElementById('op-tab-hist');
  if (btnOs)   { btnOs.style.color = tab==='os' ? 'var(--orange)' : 'var(--muted)'; btnOs.style.borderBottomColor = tab==='os' ? 'var(--orange)' : 'transparent'; }
  if (btnHist) { btnHist.style.color = tab==='hist' ? 'var(--orange)' : 'var(--muted)'; btnHist.style.borderBottomColor = tab==='hist' ? 'var(--orange)' : 'transparent'; }
  if (tab === 'os')   renderOS();
  if (tab === 'hist') carregarHistorico();
}

/* ══════════════════════════════════════════
   VER PARTES DA OS
══════════════════════════════════════════ */
async function verPartes(osId, osNumero) {
  // Navegar para aba histórico e mostrar partes desta OS
  opTab('hist');
  const el = document.getElementById('os-lista');
  el.innerHTML = `<div class="loading"><span class="spin"></span></div>`;
  try {
    const data = await api('/operacional/api/os/'+osId+'/partes');
    const partes = data.partes || [];
    const totais = data.totais || {};

    if (!partes.length) {
      el.innerHTML = `<div class="empty">
        <div class="empty-icon">📝</div>
        <div class="empty-title">Nenhum registro ainda</div>
        <div class="empty-sub">${osNumero} — clique em "Registrar dia" na OS</div>
      </div>`;
      return;
    }

    // Card de totais
    let totalHtml = `<div class="os-card" style="border-left-color:var(--green)">
      <div class="os-numero">${esc(osNumero)} — Resumo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <div style="text-align:center;background:#F0F4FF;border-radius:8px;padding:10px">
          <div style="font-size:22px;font-weight:800;color:var(--blue)">${totais.dias_trabalhados||0}</div>
          <div style="font-size:11px;color:var(--muted)">dias trabalhados</div>
        </div>
        <div style="text-align:center;background:#F0F4FF;border-radius:8px;padding:10px">
          <div style="font-size:22px;font-weight:800;color:var(--blue)">${totais.total_horas||0}h</div>
          <div style="font-size:11px;color:var(--muted)">horas totais</div>
        </div>
      </div>
    </div>`;

    // Lista de partes
    const partesHtml = partes.map(p => {
      const dt   = p.data ? new Date(p.data+'T00:00') : null;
      const dia  = dt ? dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '–';
      const horas= p.horas_trabalhadas ? parseFloat(p.horas_trabalhadas).toFixed(1)+'h' : '–';
      const hor  = p.horimetro_inicial && p.horimetro_final
        ? `${p.horimetro_inicial} → ${p.horimetro_final}` : '';
      return `<div class="hist-item">
        <div class="hist-date">
          <div>${dia.split('/')[0]}</div>
          <div style="font-size:9px;color:var(--muted)">${dia.split('/')[1]&&'/'+dia.split('/')[1]}</div>
        </div>
        <div class="hist-body">
          <div class="hist-equip">${esc(p.equipamento_codigo||'–')} ${esc(p.equipamento_descricao||'')}</div>
          <div class="hist-horas">${horas}${hor?' · '+hor:''}${p.hora_inicio&&p.hora_fim?' · '+p.hora_inicio+'-'+p.hora_fim:''}</div>
          ${p.observacao?`<div style="font-size:12px;color:var(--muted);margin-top:3px">💬 ${esc(p.observacao)}</div>`:''}
        </div>
        <div style="font-size:10px;font-weight:700;color:var(--green)">${horas}</div>
      </div>`;
    }).join('');

    el.innerHTML = totalHtml + partesHtml;
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-title">Erro ao carregar</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

/* ══════════════════════════════════════════
   HISTÓRICO GERAL
══════════════════════════════════════════ */
async function carregarHistorico() {
  const el = document.getElementById('os-lista');
  // Se já tem conteúdo carregado por verPartes, não sobrescreve
  if (el && el.innerHTML.includes('spin')) return;
  if (el) el.innerHTML = `<div class="empty">
    <div class="empty-icon">🕐</div>
    <div class="empty-title">Histórico</div>
    <div class="empty-sub">Clique em "Ver registros" numa OS para ver o detalhamento</div>
  </div>`;
}
